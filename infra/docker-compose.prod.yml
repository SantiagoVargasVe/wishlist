# Production stack for a self-hosted deployment.
#
# Exposure: NO ports published to the LAN and NO router port-forward. A cloudflared
# container is bridged onto this network, and the app's hostname is registered as a
# public hostname on the tunnel pointing at http://wishlist-app:3000.
#
# See backlog tasks T060 (tunnel hostname) and T061 (deploy).

services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: wishlist-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL}
      IMAGE_STORAGE_PATH: /app/data/images
      FX_COP_PER_USD: ${FX_COP_PER_USD}
    volumes:
      - ./data/images:/app/data/images
    networks:
      - default

  db:
    image: postgres:17-alpine
    container_name: wishlist-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

networks:
  default:
    name: wishlist_default

# Deliberately NOT backed up — this app's data is reconstructable, since items can be
# re-added from their URLs. If that ever changes: dump the DB first (raw Postgres data
# dirs aren't safe to copy hot) and capture the dump alongside ./data/images so the two
# restore as a unit.
