# Production stack for a self-hosted deployment.
#
# Pulls a prebuilt image from GHCR rather than building on the host — CI builds
# it on amd64 runners, which keeps build load off a box that is already running
# other services (ADR-0007).
#
# Exposure: NO ports published to the LAN and NO router port-forward. A
# cloudflared container is bridged onto this network and the app's hostname is
# registered as a public hostname on the tunnel, pointing at http://wishlist-app:3000.
#
# Deploy:  docker compose pull && docker compose up -d
# A systemd timer runs exactly that; see infra/deploy/.
#
# ── Service names must be globally unique across the tunnel ───────────────
# Compose gives every service its *service key* as a network alias, on top of
# `container_name`, and that alias cannot be removed. The shared `cloudflared`
# is attached to several stacks' networks at once, and Docker's embedded DNS
# resolves a name across all of them — so a service called `app` here would
# collide with an `app` in any other stack on that tunnel and the tunnel would
# route to whichever one DNS happened to return. That is not hypothetical: it
# took cloud.santiagovargas.co down with a hard 502 on 2026-08-30. Keep the
# service key equal to the container name.

services:
  wishlist-app:
    image: ghcr.io/santiagovargasve/wishlist:latest
    container_name: wishlist-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL}
      # Optional (T036) — MercadoLibre catalog-product lookups. `:-` default
      # means an operator who hasn't registered a MercadoLibre app doesn't
      # need these in .env at all; the app already treats them as optional.
      MELI_CLIENT_ID: ${MELI_CLIENT_ID:-}
      MELI_CLIENT_SECRET: ${MELI_CLIENT_SECRET:-}
      # Optional (T101/ADR-0011) — outbound SMTP. The provider is these five
      # values and nothing else; changing vendor is a .env edit.
      #
      # They have to be listed here or they never reach the container: this
      # block enumerates the environment, so a key in the host's .env that
      # isn't named is simply not passed through.
      #
      # `${VAR:-}` sets the variable to an EMPTY STRING, it does not omit it.
      # `optionalEnv()` in config.schema.ts is what turns that back into
      # "absent" — without it, an operator running no mail provider would have
      # the app refuse to boot rather than quietly disable a feature, which is
      # the opposite of what ADR-0011 promises. Same applies to the MELI pair
      # above.
      #
      # All five or none: a partial mailer fails at boot naming what is missing,
      # rather than at 3am on the one send that matters.
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-}
      MAIL_SMTP_USER: ${MAIL_SMTP_USER:-}
      MAIL_SMTP_PASS: ${MAIL_SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      # Item images. Not backed up by choice — see ADR-0004.
      - ./data/images:/app/data/images
    networks:
      - default

  db:
    image: postgres:17-alpine
    container_name: wishlist-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Bind mount here, unlike dev: production wants the data on a known host
      # path an operator can find without asking Docker where it lives.
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

networks:
  default:
    name: wishlist_default

# Schema migrations run at app startup from instrumentation.ts, so there is no
# separate migrate step. Safe with a single instance; with replicas this would
# race and belong in a one-shot job.
#
# Deliberately NOT backed up — this app's data is reconstructable, since items
# can be re-added from their URLs.
