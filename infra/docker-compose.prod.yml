# Production stack for a self-hosted deployment.
#
# Pulls a prebuilt image from GHCR rather than building on the host — CI builds
# it on amd64 runners, which keeps build load off a box that is already running
# other services (ADR-0007).
#
# Exposure: NO ports published to the LAN and NO router port-forward. A
# cloudflared container is bridged onto this network and the app's hostname is
# registered as a public hostname on the tunnel, pointing at http://wishlist-app:3000.
#
# Deploy:  docker compose pull && docker compose up -d
# A systemd timer runs exactly that; see infra/deploy/.

services:
  app:
    image: ghcr.io/santiagovargasve/wishlist:latest
    container_name: wishlist-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL}
      FX_COP_PER_USD: ${FX_COP_PER_USD:-4100}
    volumes:
      # Item images. Not backed up by choice — see ADR-0004.
      - ./data/images:/app/data/images
    networks:
      - default

  db:
    image: postgres:17-alpine
    container_name: wishlist-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Bind mount here, unlike dev: production wants the data on a known host
      # path an operator can find without asking Docker where it lives.
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

networks:
  default:
    name: wishlist_default

# Schema migrations run at app startup from instrumentation.ts, so there is no
# separate migrate step. Safe with a single instance; with replicas this would
# race and belong in a one-shot job.
#
# Deliberately NOT backed up — this app's data is reconstructable, since items
# can be re-added from their URLs.
