# Production stack for the home server. Deployed to ~/nas/wishlist/docker-compose.yml,
# matching the layout of the existing nextcloud / immich / minecraft stacks.
#
# Exposure: NO ports published to the LAN and NO router port-forward. The existing
# cloudflared container is bridged onto this network and `wish.santiagovargas.co` is added
# as a public hostname pointing at http://wishlist-app:3000 — the same approach already
# used for Immich.
#
# See backlog tasks T060 (tunnel hostname) and T061 (deploy).

services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: wishlist-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: https://wish.santiagovargas.co
      IMAGE_STORAGE_PATH: /app/data/images
      FX_COP_PER_USD: ${FX_COP_PER_USD}
    volumes:
      - ./data/images:/app/data/images
    networks:
      - default

  db:
    image: postgres:17-alpine
    container_name: wishlist-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

networks:
  default:
    name: wishlist_default

# Backups (T062): nightly `pg_dump` into a staging dir, then restic captures that plus
# ./data/images in one snapshot, so the database and its images restore as a unit.
# Raw Postgres data directories are not safe to back up hot — always dump first.
