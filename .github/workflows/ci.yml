name: CI

on:
  push:
    branches: [main]
  pull_request:

# This repo is public. The quality job must never require secrets, so that PRs
# from forks can run it safely. Image build/publish is a separate, main-only
# workflow added in T062 — see docs/adr/0007-deploy-via-ghcr-and-pull-timer.md.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest

    # Integration tests run against a real Postgres, not a mocked Drizzle. The
    # invariants that matter most here — the one-default-list partial index, the
    # unique claim constraint — are enforced by the database, and a mock would
    # let a double claim through. See docs/context/testing.md.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wishlist
          POSTGRES_PASSWORD: wishlist
          POSTGRES_DB: wishlist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # The app is scaffolded in T001. Until then there is nothing to run, and
      # a hard failure on every push would just train everyone to ignore CI.
      - id: detect
        run: |
          if [ -f package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json yet — skipping until T001 scaffolds the app."
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.detect.outputs.ready == 'true'
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.ready == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.detect.outputs.ready == 'true'
        run: npm run typecheck

      - name: Tests
        if: steps.detect.outputs.ready == 'true'
        run: npm test -- --coverage
        env:
          DATABASE_URL_TEST: postgresql://wishlist:wishlist@localhost:5432/wishlist_test

      # Deliberately no env. Config validation is lazy (see config.schema.ts),
      # so the build needs no secrets — real or placeholder. If this step ever
      # starts failing on a missing variable, something began reading config at
      # import time; fix that rather than adding fake values here.
      - name: Build
        if: steps.detect.outputs.ready == 'true'
        run: npm run build
