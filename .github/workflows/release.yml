name: Release

# Runs only after CI succeeds on main. A plain `push: [main]` trigger would race
# CI and could publish an image that never passed lint, typecheck, or tests.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: build · push to GHCR
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    # The only job in this repo holding a write token. CI stays secret-free so
    # pull requests from forks can run safely on a public repo.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is what the host's pull timer follows; the sha tag makes any
          # specific build addressable, which is what rollback needs.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          # amd64 only. The deploy target is x86; building arm64 too would
          # double build time for an image nothing runs.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
